<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auth Test</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
  section { margin-bottom: 24px; }
  input { width: 100%; padding: 4px; box-sizing: border-box; margin-bottom: 6px; }
  .output { font-family: monospace; word-break: break-all; }
</style>
</head>
<body>

<h1>Auth Test</h1>

<section>
  <h2>Register</h2>
  <form id="register-form">
    <input name="username" placeholder="username">
    <input name="password" type="password" placeholder="password">
    <button>Register</button>
  </form>
  <p class="output" id="register-output"></p>
</section>

<section>
  <h2>Login</h2>
  <form id="login-form">
    <input name="username" placeholder="username">
    <input name="password" type="password" placeholder="password">
    <button>Login</button>
  </form>
  <p class="output" id="login-output"></p>
</section>

<section>
  <h2>Token</h2>
  <p class="output" id="token"></p>
</section>

<section>
  <h2>Request</h2>
  <input id="path" value="/api/users/me">
  <button id="with-token">With token</button>
  <button id="without-token">Without token</button>
  <p class="output" id="request-output"></p>
</section>

<script>
  let token = null;

  function show(id, status, body) {
    document.getElementById(id).textContent = `${status} ${body}`;
  }

  function credentials(form) {
    return JSON.stringify({
      username: form.username.value,
      password: form.password.value
    });
  }

  async function post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body
    });
    return { status: res.status, body: await res.text() };
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await post('/api/auth/register', credentials(e.target));
    show('register-output', res.status, res.body);
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await post('/api/auth/login', credentials(e.target));
    show('login-output', res.status, res.body);

    if (res.status === 200) {
      token = JSON.parse(res.body).token;
      document.getElementById('token').textContent = token;
    }
  });

  async function send(useToken) {
    const headers = useToken && token ? { Authorization: `Bearer ${token}` } : {};
    const res = await fetch(document.getElementById('path').value, { headers });
    show('request-output', res.status, await res.text());
  }

  document.getElementById('with-token').addEventListener('click', () => send(true));
  document.getElementById('without-token').addEventListener('click', () => send(false));
</script>

</body>
</html>
